<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATOM Stok</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f8;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial;color:#17191d}
.card{width:min(520px,calc(100% - 28px));background:#fff;border:1px solid #e8eaee;border-radius:22px;padding:26px;box-shadow:0 20px 55px #17191d14}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#ff7a1a,#ff9a4d);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:950;box-shadow:0 9px 24px #ff7a1a3b}
h1{margin:18px 0 7px;font-size:29px;letter-spacing:-1.2px}p{color:#747985;line-height:1.55;font-size:13px}
input{width:100%;height:46px;border:1px solid #e4e6ea;border-radius:12px;padding:0 12px;outline:none;margin:8px 0 10px}input:focus{border-color:#ffc79f;box-shadow:0 0 0 4px #ff7a1a12}
button{width:100%;height:46px;border:0;border-radius:12px;background:#ff7a1a;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 8px 18px #ff7a1a30}
small{display:block;margin-top:12px;color:#92969f;line-height:1.45}
</style>
</head>
<body>
<div class="card">
  <div class="logo">A</div>
  <h1>ATOM Stok</h1>
  <p>İlk kullanımda Google Apps Script web uygulaması adresini gir. Sonraki girişlerde GitHub sayfası seni doğrudan stok programına yönlendirir.</p>
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
  <button onclick="go()">Stok Programını Aç</button>
  <small>Adres tarayıcında saklanır. Değiştirmek için bu sayfaya <b>?reset=1</b> ekleyerek tekrar açabilirsin.</small>
</div>
<script>
const key='atom_stock_app_url';
const qs=new URLSearchParams(location.search);
if(qs.get('reset')==='1') localStorage.removeItem(key);
const saved=localStorage.getItem(key);
if(saved && qs.get('reset')!=='1') location.replace(saved);
function go(){
  let u=document.getElementById('url').value.trim();
  if(!u){alert('Apps Script /exec adresini gir.');return}
  if(u.endsWith('/dev'))u=u.slice(0,-4)+'/exec';
  if(!u.includes('script.google.com/macros/s/')||!u.endsWith('/exec')){alert('Doğru /exec adresini gir.');return}
  localStorage.setItem(key,u);location.href=u;
}
</script>
</body>
</html>
